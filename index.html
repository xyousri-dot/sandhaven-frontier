const STORIES={
nl:[
['De eerste voetstap','Nima','De laatste bron achter ons is verzilt. Het stadshart kan rijden, maar buiten de werf wachten nog mensen. We vertrekken pas wanneer iedereen een plek heeft.','Red het kamp, activeer het baken en breng de stad naar de doorgang. Zet je schildwacht en zandloper vlak bij de stad in.','De eerste gezinnen stappen aan boord. Voor het eerst is Zandhaven meer dan een plek: het is een belofte die kan bewegen.'],
['De draad door het stof','Rafi','Mijn zus hing blauwe linten aan de seinpalen. Verkenners zagen ze bij twee kampen. We zoeken daar naar overlevenden en naar haar spoor.','Red beide kampen. Verken met je bemanning en houd de stad achter de voorhoede.','Beide kampen sluiten zich aan. Hun verkenners hebben blauwe linten gezien. Iemand wijst ons de weg.'],
['Wat een stad draagt','Sera','De storm komt vroeger dan mijn kaarten zeggen. Een stad kan niet alles meenemen. Vandaag nemen we geen goud mee, maar de mensen die de oude pompen begrijpen.','Red de ingenieurs en activeer het baken. Houd rekening met de zichtbare stormzones en gebruik je monteur.','De ingenieurs verbinden de watertanks. Een stad wordt sterker door wat mensen weten, niet alleen door wat zij bezit.'],
['De prijs van de doorgang','Nima','De poortwachters verkopen toegang tot een bron die ooit van alle dorpen was. Hun kanonnen zijn vastgebouwd. Onze stad kan bewegen. Gebruik dat voordeel.','Ruim de blokkade op en stuur de stad pas daarna door. Laat je bemanning niet alleen voor de kanonnen staan.','De doorgang is vrij. Sera weigert een tolpoort achter te laten: de volgende stad moet hier ook doorheen kunnen.'],
['Twee seinen in de nacht','Rafi','Twee kampen roepen tegelijk. Mijn zus bevindt zich bij één ervan. Ik weet niet welk. Als we dit goed plannen, hoeven we niet te kiezen wie achterblijft.','Bereik alle gemarkeerde doelen en spaar onderweg het pantser van je stad.','Beide kampen zijn aan boord. Rafi vindt zijn zus tussen de monteurs. Ze vraagt niet waar hij was, maar wat er nog gerepareerd moet worden.'],
['Een zee zonder water','Sera','Onder het zout liggen sporen van een oud waternet. De vijand bewaakt de laatste bediening. We kunnen vechten om die knop, of de oude wereld leren omzeilen.','Bescherm de stad langs de stormrand. Ontwijk de verdediging of schakel haar uit; bereik alle doelen en de uitgang.','Het waternet blijkt meerdere aansluitpunten te hebben. Eén stad kan het herstellen, maar alleen meerdere steden kunnen het eerlijk onderhouden.'],
['De stad die de weg opent','Nima','De laatste blokkade houdt niet ons tegen, maar iedereen achter ons. Ons konvooi heeft nu genoeg kennis om meer te doen dan ontsnappen. Vandaag maken we een weg.','Verbreek de laatste blokkade, voltooi de reddingen en breng het stadshart naar de vrije vlakte.','De stad stopt op de vlakte. Geen eindstation: een ontmoetingsplaats. Achter jullie verschijnen de eerste andere rijdende steden. Zandhaven heeft een weg geopend die niemand alleen hoeft te bewaken.']
],
en:[
['The first footstep','Nima','The last spring behind us has turned to salt. The city heart can move, but people are still waiting outside the yard. We leave when everyone has a place.','Rescue the camp, activate the beacon and take the city to the exit. Deploy your shieldguard and ranger near the city.','The first families step aboard. Sandhaven becomes more than a place: a promise that can move.'],
['A thread through the dust','Rafi','My sister tied blue ribbons to the signal posts. Scouts saw them near two camps. We are looking for survivors and a trace of her route.','Rescue both camps. Send your crew ahead and keep the city behind the front line.','Both camps join you. Their scouts have seen blue ribbons. Someone is showing you the way.'],
['What a city carries','Sera','The storm arrived before my maps predicted. A city cannot carry everything. Today we carry the people who understand the old pumps.','Rescue the engineers and activate the beacon. Watch the visible storm zones and use your mechanic.','The engineers connect the tanks. Knowledge strengthens a city as much as its possessions.'],
['The price of passage','Nima','The gatekeepers sell access to a spring that once belonged to every village. Their guns are fixed. Our city can move. Use that advantage.','Clear the blockade before driving through. Keep your crew supported near the guns.','The passage is open. Sera refuses to leave a toll gate: the next city must pass too.'],
['Two signals in the night','Rafi','Two camps are calling at once. My sister is at one of them. I do not know which. A careful route means nobody must be left behind.','Reach every marked objective and preserve the city hull.','Both camps are aboard. Rafi finds his sister among the mechanics. She asks what still needs repairing.'],
['A sea without water','Sera','Beneath the salt lie traces of an old water network. The enemy guards the last control. We must learn how this world connects.','Protect the city along the storm edge. Avoid or clear the defences; reach all objectives and the exit.','The network has several connections. One city can repair it, but many cities must keep it fair.'],
['The city that opens the road','Nima','The final blockade holds back everyone behind us. We know enough to do more than escape. Today we make a road.','Break the final blockade, complete the rescues and take the city heart to the open plain.','The city stops on the plain: a meeting place, not a terminus. Other travelling cities appear behind you. Sandhaven has opened a road that no one must guard alone.']
],
ar:[
['الخطوة الأولى','نيما','تملحت آخر عين خلفنا. قلب المدينة قادر على الحركة، لكن أناساً ينتظرون خارج الورشة. لن نغادر قبل أن يجد الجميع مكاناً.','أنقذ المخيم وفعّل المنارة وأوصل المدينة إلى المخرج. انشر الحارس والقناص قربها.','تصعد العائلات الأولى. صار ملاذ الرمال أكثر من مكان: وعداً يستطيع الحركة.'],
['خيط عبر الغبار','رافي','ربطت أختي أشرطة زرقاء بأعمدة الإشارة. رآها الكشافة قرب مخيمين. نبحث هناك عن الناجين وعن أثر طريقها.','أنقذ المخيمين. أرسل الطاقم للاستكشاف وأبقِ المدينة خلف المقدمة.','ينضم المخيمان إلى القافلة. رأى الكشافة أشرطة زرقاء؛ أحدهم يدلنا على الطريق.'],
['ما تحمله المدينة','سيرا','وصلت العاصفة قبل موعدها على خرائطي. لا تستطيع المدينة حمل كل شيء. اليوم نحمل من يعرفون المضخات القديمة.','أنقذ المهندسين وفعّل المنارة وراقب مناطق العاصفة واستخدم الميكانيكي.','يربط المهندسون الخزانات. تقوى المدينة بمعرفة سكانها بقدر ما تقوى بممتلكاتها.'],
['ثمن المرور','نيما','يبيع الحراس دخول عين كانت لجميع القرى. مدافعهم ثابتة ومدينتنا تتحرك. استعمل هذه الميزة.','أزل الحاجز قبل مرور المدينة وساند الطاقم أمام المدافع.','فُتح الطريق. ترفض سيرا ترك بوابة جباية؛ يجب أن تمر المدينة التالية أيضاً.'],
['إشارتان في الليل','رافي','مخيمان يناديان معاً وأختي في أحدهما. لا أعرف أيهما. بتخطيط جيد لن نترك أحداً خلفنا.','بلغ جميع الأهداف المحددة واحمِ هيكل المدينة.','الجميع على متن المدينة. يجد رافي أخته بين الميكانيكيين. تسأل عما يحتاج إلى إصلاح.'],
['بحر بلا ماء','سيرا','تحت الملح آثار شبكة ماء قديمة. يحرس العدو آخر تحكم. علينا فهم كيف تتصل أجزاء هذا العالم.','احمِ المدينة بمحاذاة العاصفة. تجنب الدفاعات أو دمّرها وبلغ كل الأهداف والمخرج.','للشبكة عدة وصلات. مدينة واحدة تصلحها، لكن عدة مدن تحتاج إلى حمايتها بعدل.'],
['المدينة التي تفتح الطريق','نيما','الحاجز الأخير يمنع كل من خلفنا. نعرف الآن ما يكفي لفعل أكثر من الهرب. اليوم نصنع طريقاً.','اكسر الحاجز الأخير وأنقذ الناس وأوصل قلب المدينة إلى السهل.','تتوقف المدينة في السهل: ملتقى لا محطة أخيرة. تظهر مدن متنقلة أخرى خلفكم. فتح ملاذ الرمال طريقاً لا يحتاج أحد إلى حراسته وحده.']
]};

    return attempt.then(value=>{if(retryableFailure&&initialized===attempt)initialized=null;return value;});
  }
  const result=(fields={})=>({earned:false,shown:false,status:'unavailable',provider,testOnly:true,revenue:0,...fields});
  async function request(kind,{requestId,context={},demoConfirm,eligibility}={}){
    const id=String(requestId||`${Date.now()}-${Math.random().toString(36).slice(2)}`);
    if(active)return result({status:'busy'});
    if(kind==='midgame'&&!interstitialEligible(eligibility||{}))return result({status:'ineligible'});
    active=id;let paused=false,shown=false;
    try{
      await initialize();emit('ad_request',{requestId:id,kind,...context});if(!status.canRequestAds)return result({requestId:id});
      paused=true;onPause();let r;
      if(profile==='local'){
        if(kind==='midgame')return result({requestId:id,status:'simulation_skipped'});
        const accepted=typeof demoConfirm==='function'&&(await demoConfirm())===true;
        r=result({requestId:id,earned:accepted,status:accepted?'demo_completed':'cancelled'});
      }else if(profile==='android'){
        const n=await bounded(native(kind==='rewarded'?'showRewarded':'showInterstitial',{requestId:id}),Math.max(timeoutMs,120000));shown=n.shown===true;
        r=result({requestId:id,shown,earned:kind==='rewarded'&&n.rewarded===true&&n.testOnly===true,status:n.status||'error'});
      }else r=await new Promise(resolve=>{
        let settled=false;
        const done=v=>{if(settled)return;settled=true;clearTimeout(timer);resolve(v);};
        const timer=setTimeout(()=>done(result({requestId:id,shown,status:'timeout'})),Math.max(timeoutMs,120000));
        try{cg.ad.requestAd(kind,{
          adStarted:()=>{if(!settled&&!shown){shown=true;emit('ad_show',{requestId:id,kind,...context});}},
          adFinished:()=>done(result({requestId:id,shown,earned:kind==='rewarded',status:'finished'})),
          adError:e=>done(result({requestId:id,shown,status:'unavailable',errorCode:String(e?.code||'other')}))
        });}catch{done(result({requestId:id,shown,status:'error'}));}
      });
      if(profile==='android'&&shown)emit('ad_show',{requestId:id,kind,...context});
      emit(r.earned?'ad_test_reward':'ad_end',{requestId:id,kind,shown:r.shown,status:r.status,...context});return r;
    }catch{emit('ad_error',{requestId:id,kind,...context});return result({requestId:id,shown,status:'error'});}
    finally{active=null;if(paused)onResume();}
  }
  return {
    initialize,getStatus:()=>({...status}),rewarded:o=>request('rewarded',o),interstitial:o=>request('midgame',o),
    async privacyOptions(){if(profile==='android')try{const r=await bounded(native('showPrivacyOptions'));Object.assign(status,{canRequestAds:r.canRequestAds===true,privacyOptionsRequired:r.privacyOptionsRequired===true});}catch{status.canRequestAds=false;}return {...status};},
    gameplayStart(){if(!playing){playing=true;game('gameplayStart');}},gameplayStop(){if(playing){playing=false;game('gameplayStop');}}
  };
}

async function api(path,method='GET',body){const r=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(6000)});const value=await r.json();if(!r.ok){const e=new Error(value.error?.message||'Request failed');e.code=value.error?.code;e.status=r.status;throw e;}return value;}
async function refreshNetwork(){if(networkPending)return;networkPending=true;try{await api('health');connection.ready=true;connection.error=null;if(token){try{connection.player=(await api('me')).player;}catch(e){if(e.status===401){token=null;write('server-token',null);connection.player=null;}else throw e;}if(token){const [list,clan]=await Promise.all([api('clans'),api('clan')]);connection.clans=list.clans;connection.clan=clan.clan;}}}catch{connection.ready=false;connection.error=t('networkError');}finally{connection.checked=true;networkPending=false;if(view==='clans')render();}}
async function networkAction(fn){if(networkPending)return;networkPending=true;try{await fn();connection.error=null;}catch{connection.error=t('networkError');}finally{networkPending=false;if(!connection.error)await refreshNetwork();else render();}}
function clanView(){const c=connection.clan,p=connection.player;return `<div class="page-head"><div><span class="eyebrow">${t('clans')}</span><h1>${t('clanHeading')}</h1><p>${t('clanIntro')}</p></div><span class="network-status">${connection.ready?'LOCAL · ONLINE':'LOCAL · OFFLINE'}</span></div>${!connection.ready?`<section class="panel clan-empty"><p>${t('serverUnavailable')}</p>${action('refresh-network',t('refresh'))}</section>`:!p?`<div class="network-grid"><section class="panel"><h2>${t('connect')}</h2><label for="player-name">${t('name')}</label><input id="player-name" maxlength="24" autocomplete="off" placeholder="${lang==='ar'?'اسمك':'Jouw naam'}">${action('connect-player',t('connect'),'primary',networkPending)}<p>${t('localProfile')}</p></section><section class="panel"><h2>${t('objective')}</h2><p>${t('supplyNote')}</p></section></div>`:`<div class="network-grid"><section class="panel"><div class="side-title"><h2>${esc(p.name)}</h2>${action('refresh-network','↻','subtle',networkPending)}</div><p>${t('supplies')}: <b>${p.supplies}</b></p><p class="metric-label">${t('supplyNote')}</p>${c?`<h2>${esc(c.name)}</h2><progress class="clan-progress" value="${c.progress}" max="${c.goal}"></progress><b>${t('target')}: <bdi>${c.progress}/${c.goal}</bdi></b><p>${c.milestoneUnlocked?'✦ '+(lang==='nl'?'De konvooilantaarn is vrijgespeeld.':lang==='ar'?'تم فتح فانوس القافلة.':'Convoy lantern unlocked.'):''}</p>${action('contribute',t('donate'),'primary',networkPending||p.supplies<10||c.goal-c.progress<10)}${action('leave-clan',t('leave'),'subtle',networkPending)}<h3 style="margin-top:20px">${t('members')}</h3>${c.members.map(m=>`<div class="member"><span>${esc(m.name)}</span><span>◈</span></div>`).join('')}`:`<label for="clan-name">${t('clanName')}</label><input id="clan-name" maxlength="32" autocomplete="off">${action('create-clan',t('create'),'primary',networkPending)}`}</section><section class="panel"><h2>${t('clans')}</h2>${connection.clans.length?connection.clans.map(g=>`<div class="clan-card"><div><b>${esc(g.name)}</b><p><bdi>${g.memberCount} · ${g.progress}/${g.goal}</bdi></p></div>${!c?`<button data-join="${esc(g.id)}" ${networkPending?'disabled':''}>${t('join')}</button>`:''}</div>`).join(''):`<p>${t('noClans')}</p>`}</section></div>`}${connection.error?`<p role="alert">${esc(connection.error)}</p>`:''}`;}

function render(){renderer?.destroy();renderer=null;document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';ROOT.innerHTML=header()+`<main>${notice||saveFailure?`<div class="toast" role="status">${esc(saveFailure?t('saveFailed'):notice)}</div>`:''}${view==='home'?homeView():view==='crew'?crewView():view==='world'?worldView():view==='battle'?battleView():view==='result'?resultView():clanView()}</main><footer class="footer">${profile==='crazygames'?'':`<span>${t('prototype')} · ${t('offline')}</span>`}<span>© MASAR · 2026</span></footer><dialog id="dialog"></dialog>`;$('#language').value=lang;bind();const canvas=$('#world-canvas');if(canvas){renderer=Scene.createRenderer(canvas);renderer.setCamera?.({zoom,panX,panY});bindCanvas(canvas);draw(performance.now()/1000);}if(battle)updateHud();if(pendingIntro&&view==='home'&&!battle)launch(0);}
function navigate(next){if(busy||battle)return;view=next;notice='';placement=null;movingId=null;mode='select';zoom=1;panX=panY=0;render();window.scrollTo({top:0,behavior:'instant'});event('view',{view});if(next==='clans')refreshNetwork();}
function mutation(fn,message,name){if(busy||battle)return;const success=fn();notice=t(success?message:'notAllowed');if(success){persist();event(name);}render();return success;}
function chooseMode(next){if(busy)return;mode=next;hover=null;render();}
function firstJourneyGuide(){const steps=lang==='ar'?['انشر حارسًا قرب مدينتك.','اختر «حرّك المدينة» واضغط على الطريق.','أنقذ الناس ثم أوصل المدينة إلى المخرج.']:lang==='nl'?['Zet een schildwachter dicht bij je stad in.','Kies ‘Stad rijden’ en tik op de route.','Red de mensen en breng je stad naar de uitgang.']:['Deploy a shield guard near your city.','Choose “Move city” and tap the route.','Rescue the people, then reach the exit.'];return `<ol class="first-journey">${steps.map(step=>`<li>${step}</li>`).join('')}</ol>`;}
function launch(id){if(battle||busy||initializing||!Engine.getMission(id))return;if(Engine.isExpedition(id))return depart(id);const s=story(id),first=id===0&&!campaign.missions[0].wins;showDialog(`<span class="eyebrow">${t('intro')} · ${id+1}/7</span>${portrait(s[1],'story-portrait')}<h1>${s[0]}</h1><p>${s[2]}</p>${first?firstJourneyGuide():`<p class="dialog-caption">${s[3]}</p>${masteryPanel(id)}<p class="dialog-caption">${t('restartNote')}</p>`}${action('depart',t('start'),'primary')}`);$('#depart').onclick=()=>depart(id);}
function depart(id){{if(pendingIntro){pendingIntro=false;write('auto-intro',true);}if(busy||initializing||document.hidden)return;const b=Engine.startBattle(campaign,id);if(!b){notice=t('notAllowed');closeDialog();render();return;}battle=b;cursor={x:b.playerCity.x,y:b.playerCity.y};view='battle';paused=false;mode='deploy:shield';zoom=1;panX=panY=0;notice='';selectedMission=id<7?id:selectedMission;persist();event('mission_start',{mission:id});ads.gameplayStart();render();window.scrollTo({top:0,behavior:'instant'});};}
function finish(){if(!battle||battle.status==='playing')return;const b=battle,r=Engine.finishBattle(campaign,b);if(!r)return;escortMedals=Mastery.recordEscortMedal(escortMedals,b);write('escort-medals',escortMedals);result={...r,battleId:b.id,missionId:b.missionId,time:b.time,casualties:b.casualties,deployed:b.deployed,medal:Mastery.escortMedal(b)};event('mission_finish',{mission:b.missionId,won:r.won,seconds:b.time,stars:r.stars,casualties:b.casualties,escortMedal:result.medal});battle=null;view='result';paused=false;mode='select';ads.gameplayStop();persist();render();window.scrollTo({top:0,behavior:'instant'});}
function pauseGame(value){if(!battle||battle.status!=='playing')return;value=value||busy||initializing||document.hidden;paused=value;if(value)persist();const cover=$('#pause-cover');if(cover)cover.hidden=!value;$('#pause')?.setAttribute('aria-pressed',String(value));for(const element of document.querySelectorAll('[data-deploy],#command-city,#command-halt,#command-rally,#command-escort'))element.disabled=value||(element.dataset.deploy?battle.reserve[element.dataset.deploy]===0:false);value?ads.gameplayStop():ads.gameplayStart();event(value?'pause':'resume',{mission:battle.missionId});}
function issue(point){if(!point||busy||paused||!renderer)return;cursor={x:point.x,y:point.y};if(battle){if(!mode.startsWith('deploy:')&&!['city','rally'].includes(mode))return;const ok=Checkpoint.command(battle,mode,point.x,point.y);if(ok){persist();event('command',{mission:battle.missionId,command:mode,x:Math.round(point.x*10)/10,y:Math.round(point.y*10)/10});notice='';}else notice=t('notAllowed');$('#command-help').textContent=notice||modeHint();updateHud();return;}if(view==='home'){const x=Math.floor(point.x),y=Math.floor(point.y);if(placement){const type=placement;if(mutation(()=>Engine.build(campaign,type,x,y),'built','build')){selectedId=campaign.buildings.at(-1).id;placement=null;render();}}else if(movingId){if(mutation(()=>Engine.moveBuilding(campaign,movingId,x,y),'moved','building_move')){movingId=null;render();}}else{selectedId=campaign.buildings.find(b=>x>=b.x&&x<b.x+b.w&&y>=b.y&&y<b.y+b.h)?.id||null;render();}}}
function bindCanvas(canvas){let down=null;canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);down={x:e.clientX,y:e.clientY,px:panX,py:panY};});canvas.addEventListener('pointermove',e=>{if(down&&mode==='pan'){panX=down.px+e.clientX-down.x;panY=down.py+e.clientY-down.y;renderer?.setCamera?.({zoom,panX,panY});}else hover=renderer?.pick(e.clientX,e.clientY);});canvas.addEventListener('pointerup',e=>{if(down&&mode!=='pan'&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<12)issue(renderer?.pick(e.clientX,e.clientY));down=null;});canvas.addEventListener('pointercancel',()=>down=null);canvas.addEventListener('pointerleave',()=>hover=null);canvas.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter',' '].includes(e.key))e.preventDefault();if(e.key===' '){pauseGame(!paused);return;}if(e.key==='ArrowLeft')cursor.x=Math.max(.5,cursor.x-1);if(e.key==='ArrowRight')cursor.x=Math.min(13.5,cursor.x+1);if(e.key==='ArrowUp')cursor.y=Math.max(.5,cursor.y-1);if(e.key==='ArrowDown')cursor.y=Math.min(13.5,cursor.y+1);hover={...cursor};if(e.key==='Enter')issue(cursor);});}
function draw(time){if(!renderer)return;const reducedMotion=reduceMotionQuery?.matches===true;if(battle)renderer.renderBattle({...battle,cosmetic},{selectedUnit:mode.startsWith('deploy:')?mode.slice(7):null,hover,time:battle.time,reducedMotion});else if(view==='home')renderer.renderHome({...campaign,cosmetic},{selectedId,placement:placement?{type:placement,x:Math.floor(hover?.x??cursor.x),y:Math.floor(hover?.y??cursor.y)}:null,hover,time,reducedMotion});}
function updateHud(){if(!battle||!$('#city-hp'))return;$('#city-hp').textContent=Math.ceil(battle.playerCity.hp)+'/'+battle.playerCity.maxHp;$('#health-bar').value=battle.playerCity.hp/battle.playerCity.maxHp;const left=Math.max(0,Engine.getMission(battle.missionId).timeLimit-Math.floor(battle.time));$('#battle-time').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');for(const type of Engine.UNIT_TYPES){$('#reserve-'+type).textContent=battle.reserve[type];document.querySelector('[data-deploy="'+type+'"]').disabled=paused||battle.reserve[type]===0;}for(const el of document.querySelectorAll('#command-city,#command-halt,#command-rally,#command-escort'))el.disabled=paused||busy||initializing;$('#objectives').innerHTML=objectivesHTML();$('#field-report').textContent=`${battle.units.filter(u=>u.hp>0).length} ${t('crew')} · ${battle.enemies.filter(u=>u.hp>0).length} ${lang==='nl'?'tegenstanders':lang==='ar'?'خصوم':'opponents'}`;}
function frame(now){const dt=lastTime?Math.min((now-lastTime)/1000,.075):0;lastTime=now;if(battle&&!paused&&!busy&&!document.hidden){Engine.stepBattle(battle,dt);if(battle.status!=='playing')finish();else if(now-checkpointTime>=1000){persist();checkpointTime=now;}}if(now-hudTime>150){updateHud();hudTime=now;}draw(now/1000);requestAnimationFrame(frame);}
function showDialog(html){if(battle)pauseGame(true);const dialog=$('#dialog');dialog.innerHTML=`<div class="dialog-top"><span class="eyebrow">${t('title')}</span>${action('dialog-close','×','subtle')}</div>`+html;$('#dialog-close').setAttribute('aria-label',t('close'));$('#dialog-close').onclick=closeDialog;dialog.showModal();}

function openSettings(){showDialog(`<h2>${t('settings')}</h2><p>${t('saved')}</p><p>${t('restartNote')}</p><div class="button-row">${action('export',t('export'))}${action('import',t('import'))}</div><label class="check"><input type="checkbox" id="metrics" ${allow?'checked':''}>${t('metrics')}</label><p>${t('metricsNote')}</p><div class="button-row">${action('export-metrics',t('exportMetrics'))}${action('clear-metrics',t('clearMetrics'))}</div><p>${t('privacy')}</p>`);$('#export').onclick=()=>download('zandhaven-reizende-stad.json',JSON.stringify({...JSON.parse(Engine.serialize(campaign)),escortMedals}));$('#import').onclick=()=>{showDialog(`<h2>${t('import')}</h2><p>${t('importWarning')}</p><input type="file" id="save-file" accept=".json,application/json"><textarea id="save-json" aria-label="JSON" maxlength="100000"></textarea>${action('import-confirm',t('confirmImport'),'primary')}<p role="alert" id="import-error"></p>`);$('#save-file').onchange=async e=>{const f=e.target.files?.[0];if(f&&f.size<=100000)$('#save-json').value=await f.text();else $('#import-error').textContent=t('invalid');};$('#import-confirm').onclick=()=>{const next=Engine.restore($('#save-json').value);if(!next){$('#import-error').textContent=t('invalid');return;}campaign=next;escortMedals=Mastery.cleanEscortMedals(JSON.parse($('#save-json').value).escortMedals);write('escort-medals',escortMedals);battle=null;paused=false;ads.gameplayStop();view='home';selectedId=null;placement=null;movingId=null;persist();event('save_import');notice=t('loaded');render();};};$('#metrics').onchange=e=>{allow=e.target.checked;write('metrics',allow);if(allow)event('consent_local');};$('#export-metrics').onclick=()=>download('zandhaven-speelmetingen.json',JSON.stringify({build:'0.9.0-challenge',localOnly:true,events},null,2));$('#clear-metrics').onclick=()=>{events=[];allow=false;write('metrics',false);write('events',[]);$('#metrics').checked=false;};}
async function reward(){if(busy||battle||!result?.won||!Engine.canClaimMissionBonus(campaign,result)||(globalThis.MasarGrowth&&!MasarGrowth.enabled()))return;busy=true;render();const before=JSON.stringify(campaign);try{const request=()=>ads.rewarded({context:{game:'sandhaven-frontier',mission:result.missionId,placement:'mission-supplies'}});const r=globalThis.MasarGrowth?await MasarGrowth.testReward(request):await request();if(Engine.claimMissionBonus(campaign,result,r)){if(persist()){event('mission_bonus_granted',{amount:8,resource:'materials',testOnly:true,revenue:0});notice=t('adDone');}else{campaign=Engine.restore(before);notice=t('saveFailed');}}else notice=t('adFail');}catch{notice=t('adFail');}finally{busy=false;render();}}
